<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+JP:wght@600&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #fff; }
  .wrap { position: relative; width: 1200px; height: 630px; }
  .logo { position: absolute; left: 96px; top: 96px; width: 380px; color: #132C4C; }
  .logo svg { display: block; width: 380px; height: 121px; }
  .sub { display: block; margin-top: 18px; text-align: center; font: 500 34px "Cormorant Garamond", serif; letter-spacing: 0.42em; margin-right: -0.42em; }
  .copy { position: absolute; left: 96px; top: 340px; font: 600 34px/1.6 "Noto Serif JP", serif; letter-spacing: 0.06em; color: #132C4C; }
  .tag { position: absolute; left: 96px; top: 500px; font: 600 20px "Cormorant Garamond", serif; letter-spacing: 0.24em; color: #546580; }
  .motif { position: absolute; inset: 0; }
</style>
</head>
<body>
<div class="wrap">
  <svg class="motif" viewBox="0 0 1200 630">
    <line x1="760" y1="630" x2="1200" y2="105" stroke="#132C4C" stroke-width="2"/>
    <polygon points="1020,250 1086,250 950,412 884,412" fill="#2A4258"/>
    <line x1="880" y1="630" x2="1150" y2="308" stroke="#A9ADC0" stroke-width="2"/>
  </svg>
  <div class="logo">
    <svg viewBox="0 0 290 92">
      <defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A4258"/><stop offset="1" stop-color="#C6CCD6"/></linearGradient></defs>
      <path d="M0 0h64v12H0zM25 0h14v92H25z" fill="currentColor"/>
      <path d="M104 0h13L85 92H72z" fill="url(#a)"/>
      <path d="M104 0h13l33 92h-14z" fill="currentColor"/>
      <path d="M228 18.5A39 39 0 1 0 239 52v-5h-27" fill="none" stroke="currentColor" stroke-width="12"/>
      <path d="M272 0h13v92h-13z" fill="currentColor"/>
    </svg>
    <span class="sub">Consulting</span>
  </div>
  <p class="copy" style="margin:0">業務のつながりを設計し直し、<br>AIエージェントで回し続ける。</p>
  <p class="tag" style="margin:0">BPR × AI AGENT CONSULTING</p>
</div>
</body>
</html>
